name: "Apply requested Toolbox fixes"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-v130-requested-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply requested source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("installer/jjs_kodi_toolbox.py")
          source = path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          def replace_in_section(text, start_marker, end_marker, old, new, label):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              block = replace_once(text[start:end], old, new, label)
              return text[:start] + block + text[end:]

          source = replace_once(source, 'APP_VERSION = "1.29"', 'APP_VERSION = "1.30"', "version")

          source = replace_once(
              source,
              '''        dialog.protocol("WM_DELETE_WINDOW", self._close_operation_dialog)\n        self._center_child_on_main(dialog)\n        self._operation_pending_message = None\n''',
              '''        dialog.bind("<Return>", lambda _event: self._close_operation_dialog())\n        dialog.bind("<KP_Enter>", lambda _event: self._close_operation_dialog())\n        dialog.protocol("WM_DELETE_WINDOW", self._close_operation_dialog)\n        self._center_child_on_main(dialog)\n        self._operation_pending_message = None\n''',
              "operation dialog Return binding",
          )

          source = replace_once(
              source,
              '''            dialog.protocol("WM_DELETE_WINDOW", lambda: finish(None))\n            self._center_child_on_main(dialog)\n            dialog.grab_set()\n            listbox.focus_set()\n''',
              '''            dialog.bind(\n                "<Return>",\n                lambda _event: finish(\n                    choices[int(listbox.curselection()[0])] if listbox.curselection() else None\n                ),\n            )\n            dialog.bind(\n                "<KP_Enter>",\n                lambda _event: finish(\n                    choices[int(listbox.curselection()[0])] if listbox.curselection() else None\n                ),\n            )\n            dialog.protocol("WM_DELETE_WINDOW", lambda: finish(None))\n            self._center_child_on_main(dialog)\n            dialog.grab_set()\n            listbox.focus_set()\n''',
              "selection dialog Return binding",
          )

          start = source.index("    def _start_kodi(")
          end = source.index("    def _profile_nonempty(", start)
          block = source[start:end]
          block = replace_once(
              block,
              "    def _start_kodi(self, info: dict, role: str) -> None:\n",
              '''    def _start_kodi(\n        self,\n        info: dict,\n        role: str,\n        allow_android_initialization: bool = False,\n    ) -> None:\n''',
              "start-kodi signature",
          )
          block = replace_once(
              block,
              '''        if info["platform"] == "android":\n            self._adb(\n''',
              '''        if info["platform"] == "android":\n            if not allow_android_initialization:\n                self.log("Kodi remains stopped on Android; automatic ADB relaunch is disabled.")\n                return\n            self._adb(\n''',
              "Android start guard",
          )
          source = source[:start] + block + source[end:]

          source = replace_in_section(
              source,
              "    def _ensure_target_profile(",
              "    # ---------- selective profile content ----------",
              "                self._start_kodi(info, role)\n",
              "                self._start_kodi(info, role, allow_android_initialization=True)\n",
              "Android one-time profile initialization",
          )

          start = source.index("    def _database_start_kodi(")
          end = source.index("    def _direct_database_config(", start)
          block = source[start:end]
          android_start = block.index('        if info["platform"] == "android":')
          libreelec_start = block.index('        client = self._ssh_client("source")', android_start)
          block = block[:android_start] + '''        if info["platform"] == "android":\n            self.log("Kodi remains stopped after database operation.")\n            return\n\n''' + block[libreelec_start:]
          source = source[:start] + block + source[end:]

          source = replace_in_section(
              source,
              "    def _database_backup(self, kind: str) -> None:",
              "    def _database_restore(self, kind: str) -> None:",
              '''            finally:\n                if stopped:\n                    self._database_start_kodi(info)\n''',
              '''            finally:\n                if stopped:\n                    if info["platform"] == "libreelec":\n                        self._database_start_kodi(info)\n                    else:\n                        self.log("Kodi remains stopped after database backup.")\n''',
              "database backup restart policy",
          )

          for start_marker, end_marker, label in (
              ("    def _create_selective_backup(", "    def _remove_profile_component_paths(", "selective backup"),
              ("    def _create_backup(", "    # ---------- backup parsing / smart restore ----------", "full backup"),
          ):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              block = source[start:end]
              block = replace_once(
                  block,
                  "            if was_running and not leave_stopped:\n",
                  '            if was_running and not leave_stopped and info["platform"] == "libreelec":\n',
                  f"{label} failure restart",
              )
              block = replace_once(
                  block,
                  "        if was_running and not leave_stopped:\n",
                  '        if was_running and not leave_stopped and info["platform"] == "libreelec":\n',
                  f"{label} success restart",
              )
              text = "selective backup" if "selective" in label else "backup"
              block = replace_once(
                  block,
                  "            self._start_kodi(info, role)\n\n        progress(1.0,",
                  f'''            self._start_kodi(info, role)\n        elif was_running and info["platform"] == "android":\n            self.log("Kodi remains stopped after {text}.")\n\n        progress(1.0,''',
                  f"{label} Android stopped log",
              )
              source = source[:start] + block + source[end:]

          source = replace_in_section(
              source,
              "    def _delete_profile_content(self) -> None:",
              "    def _backup_only(self) -> None:",
              '''            if was_running:\n                self._set_progress(90, "Starting Kodi")\n                self._start_kodi(target, "target")\n''',
              '''            if target["platform"] == "libreelec" and was_running:\n                self._set_progress(90, "Starting Kodi")\n                self._start_kodi(target, "target")\n            elif was_running:\n                self.log("Kodi remains stopped after deleting selected profile content.")\n''',
              "delete success restart policy",
          )
          source = replace_in_section(
              source,
              "    def _delete_profile_content(self) -> None:",
              "    def _backup_only(self) -> None:",
              '''        except Exception:\n            if was_running:\n                try:\n                    self._start_kodi(target, "target")\n                except Exception:\n                    pass\n''',
              '''        except Exception:\n            if target["platform"] == "libreelec" and was_running:\n                try:\n                    self._start_kodi(target, "target")\n                except Exception:\n                    pass\n            elif was_running:\n                self.log("Kodi remains stopped after failed target-content deletion.")\n''',
              "delete failure restart policy",
          )

          path.write_text(source, encoding="utf-8")
          PY

      - name: Validate patched source
        shell: bash
        run: |
          python -m py_compile installer/jjs_kodi_toolbox.py installer/jjs_kodi_database.py
          python - <<'PY'
          from pathlib import Path
          s = Path("installer/jjs_kodi_toolbox.py").read_text(encoding="utf-8")
          assert 'APP_VERSION = "1.30"' in s
          start = s[s.index("    def _start_kodi("):s.index("    def _profile_nonempty(")]
          assert "allow_android_initialization" in start
          assert "automatic ADB relaunch is disabled" in start
          init = s[s.index("    def _ensure_target_profile("):s.index("    # ---------- selective profile content ----------")]
          assert "allow_android_initialization=True" in init
          assert s.count('was_running and not leave_stopped and info["platform"] == "libreelec"') == 4
          dialogs = s[s.index("    def _finish_operation_dialog"):s.index("    def _set_progress(")]
          assert '<Return>' in dialogs and '<KP_Enter>' in dialogs
          chooser = s[s.index("    def _choose_from_list"):s.index("    def _selected_profile_components")]
          assert '<Return>' in chooser and '<KP_Enter>' in chooser
          delete = s[s.index("    def _delete_profile_content"):s.index("    def _backup_only")]
          assert 'target["platform"] == "libreelec" and was_running' in delete
          db = s[s.index("    def _database_backup"):s.index("    def _database_restore")]
          assert 'Kodi remains stopped after database backup.' in db
          print("Requested fixes validated")
          PY

      - name: Commit source change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer/jjs_kodi_toolbox.py
          git diff --cached --check
          git commit -m "Release 1.30: keep Android stopped and support Return on OK"
          git push origin HEAD:main
